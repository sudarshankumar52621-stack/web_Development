<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO list</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="contianer bg-gray-800 rounded-xl item-center justify-center shadow-lg">
        <h1 class="text-blue-500 py-4 text-3xl">To-Do List</h1>
        <div class="input-container m-9">
            <input type="text" id="todo-input" placeholder="Add a new task..." class="rounded mx-2 text-black">
            <button id="add-task-btn" class="bg-blue-500 px-2 rounded max-w-md mx-2 hover:bg-blue-600">Add Task</button>
        </div>
        <ul id="todo-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
