<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-500 flex justify-center items-center min-h-screen">
    <div class="container bg-gray-600  rounded-xl m-6 border-2 border-gray-700">
        <h1 class="text-3xl font-bold m-2">Products</h1>
        <div id="product-list">
            <!-- Product will be dynamically added here by javascript -->
        </div>

        <h2 class="m-2 text-2xl font-bold">Shopping Cart</h2>
        <div id="cart-items" class="m-2">
            <p id="empty-cart">your cart is empty.</p>
        </div>
        <div id="cart-total" class="hidden  m-2">
            <p>Total: <span id="total-price">$0.00</span></p>
            <button id="checkout-btn" class="bg-blue-500 rounded-lg hover:bg-blue-700 border border-gray-900 p-1">Checkout</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
