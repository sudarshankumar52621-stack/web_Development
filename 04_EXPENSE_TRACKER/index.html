<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-600 px-2 py-4 flex items-center justify-center min-h-screen">
    <div class="container bg-gray-700 px-4 py-8 w-fit rounded-2xl border-4 border-gray-500">
        <h1 class="text-3xl py-2 text-green-300 text-center italic">Expense Tracker</h1>
        <form action="" id="expense-form">
            <input type="text" id="expense-name" placeholder="Expanse-name" required class="rounded px-2 hover:border-2 hover:border-green-400 mx-2">
            <input type="text" id="expense-amount" placeholder="amount" required class="rounded px-2 hover:border-2 hover:border-green-400 mx-2">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 rounded-xl px-2 border-2 border-gray-900">Add Expense</button>
        </form>

        <h2 class="text-xl text-white m-1">Expenses</h2>
        <ul id="expense-list" class="text-green-600">
            <!-- Expenses will be dynamically added here -->
        </ul>

        <div id="total">
            <h3 class="text-end m-1 text-2xl text-gray-100 ">Total: <span class="text-red-500">$</span><span id="total-amount" class="text-blue-300">0.00</span>  </h3>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
