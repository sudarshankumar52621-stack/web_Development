<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-500 flex justify-center items-center min-h-screen" >
    <div class="container bg-gray-600 w-fit rounded-md border border-gray-700">
        <h1 class="text-green-400 font-bold text-3xl px-2 text-center">Quiz App</h1>
        <div id="quiz-container ">
            <div id="question-container" class="hidden">
                <h2 id="question-text" class="text-2xl text-white p-2 m-1"></h2>
                <ul id="choice-list" class="text-xl p-2 m-1 ">
                    <!--Choice will be added dynamically here -->
                </ul>
                <button id="next-btn" class="hidden bg-blue-600 rounded m-2 p-1 ">Next Question</button>
            </div>
            <div id="result-container" class="hidden">
                <h2 class="text-3xl">Your Score</h2>
                <p id="score" class="text-white text-2xl"></p>
                <button id="restart-btn" class="bg-blue-500 rounded hover:bg-blue-600 border-2 m-2 ">Restart Quiz</button>
            </div>
            <button id="start-btn" class="bg-blue-500 rounded-md m-2 border border-gray-700 hover:bg-blue-600">Start Quiz</button>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
